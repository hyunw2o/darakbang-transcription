services:
  - type: web
    name: darakbang-transcription-backend
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: OAUTH_REDIRECT_ALLOW_HOSTS
        sync: false
      - key: OAUTH_REDIRECT_ALLOW_SCHEMES
        sync: false
      - key: FREE_MONTHLY_LIMIT_SECONDS
        sync: false
      - key: USAGE_TIMEZONE
        sync: false
      - key: BILLING_PROVIDER
        sync: false
      - key: BILLING_TEST_MODE
        sync: false
      - key: MOCK_CHECKOUT_SESSION_TTL_SECONDS
        sync: false
      - key: PORTONE_STORE_ID
        sync: false
      - key: PORTONE_CHANNEL_KEY
        sync: false
      - key: PORTONE_API_SECRET
        sync: false
      - key: PORTONE_WEBHOOK_SECRET
        sync: false
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: PAID_PLAN_TIER
        sync: false
      - key: BILLING_SUCCESS_URL
        sync: false
      - key: BILLING_CANCEL_URL
        sync: false
      - key: BILLING_PORTAL_RETURN_URL
        sync: false
      - key: EXPOSE_TERMS_ENDPOINT
        sync: false
